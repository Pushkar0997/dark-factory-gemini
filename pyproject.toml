[project]
name = "dark-factory-gemini"
version = "0.1.0"
description = "Generic coordinator/implementer/reviewer software factory for Band Desktop — Claude Code, Google ADK (Gemini) or hybrid seats"
readme = "README.md"
authors = [
    { name = "Pushkar Kumar", email = "pushkarkumar0997@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "band-sdk[google-adk]>=4.0.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]


[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
factory-seat = "factory.seat:main"
factory-planner = "factory.planner:main"
factory-builder = "factory.builder:main"
factory-reviewer = "factory.reviewer:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

