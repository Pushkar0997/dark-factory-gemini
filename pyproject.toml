[project]
name = "dark-factory-gemini"
version = "0.1.0"
description = "Gemini-powered coding agent for BAND Desktop — built for the WeAreDevelopers x BAND Dark Factory Hackathon"
readme = "README.md"
authors = [
    { name = "Pushkar Kumar", email = "pushkarkumar0997@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "band-sdk[google-adk]>=4.0.0",
]

[project.scripts]
dark-factory-gemini = "dark_factory_gemini:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
