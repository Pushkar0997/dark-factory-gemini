[project]
name = "dark-factory-gemini"
version = "0.1.0"
description = "Autonomous Gemini Multi-Agent Software Factory for BAND Desktop — WeAreDevelopers x BAND Hackathon"
readme = "README.md"
authors = [
    { name = "Pushkar Kumar", email = "pushkarkumar0997@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "band-sdk[google-adk]>=4.0.0",
]

[project.scripts]
factory-planner = "factory.planner:main"
factory-builder = "factory.builder:main"
factory-reviewer = "factory.reviewer:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

